    <link

    <link

        href="../styles/global.css"

    <!-- Components -->

<!-- =========================
     NAVBAR
========================= -->

<header class="navbar">

    <a
        href="../index.html"
        class="logo"
    >
        NYTHRA
    </a>


    <nav>

        <a href="../index.html#sobre">
            Sobre
        </a>

        <a
            href="systems.html"
            class="active"
        >
            Sistemas
        </a>

        <a
            href="login.html"
            id="auth-link"
        >
            Login
        </a>

    </nav>

</header>



<!-- =========================
     MAIN
========================= -->

<main class="systems-page">


    <!-- HEADER -->

    <section class="systems-header">

        <h1>
            Meus sistemas
        </h1>

        <p>
            Acesse um sistema para visualizar suas fichas.
        </p>

    </section>



    <!-- =========================
         SYSTEM LIST
    ========================= -->

    <section class="systems-list">


        <!-- ORDEM PARANORMAL -->

        <a
            href="sheets.html?system=ordem-paranormal"
            class="system-item"
        >

            <div class="system-icon">

                <span>
                    OP
                </span>

            </div>


            <div class="system-info">

                <h2>
                    Ordem Paranormal
                </h2>

                <p>
                    Investigação, mistérios e o Outro Lado.
                </p>

            </div>


            <span
                class="system-arrow"
                aria-hidden="true"
            >
                &rsaquo;
            </span>

        </a>



        <!-- JOJO -->

        <a
            href="sheets.html?system=jojo"
            class="system-item"
        >

            <div class="system-icon">

                <span>
                    JJ
                </span>

            </div>


            <div class="system-info">

                <h2>
                    JoJo
                </h2>

                <p>
                    Stands, habilidades e aventuras bizarras.
                </p>

            </div>


            <span
                class="system-arrow"
                aria-hidden="true"
            >
                &rsaquo;
            </span>

        </a>


    </section>
